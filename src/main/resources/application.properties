# jadx analysis daemon.
#
# This process no longer speaks MCP. It is a plain local HTTP service; the MCP
# protocol lives in mcp_server/jadx_mcp.py, which talks to these endpoints.
spring.main.web-application-type=servlet
spring.main.banner-mode=off

# Localhost only. These endpoints read arbitrary classes and resources out of a
# loaded APK, so they must never be reachable from the network.
server.address=127.0.0.1
server.port=${JADX_PORT:8765}

# One log file per daemon, keyed by the port, because the advice here is to run
# one daemon per concurrent analysis. jadx.log.file is published by DaemonLogFile
# from main() before Spring initialises logging; the default below is the path
# a default-port daemon has always used, so nothing grepping it breaks.
logging.file.name=${jadx.log.file:/tmp/jadx-mcp-server.log}

# Console stays silent on purpose. The daemon is detached and nothing reads its
# stdout; per-daemon files are how you find a warning, not console logging.
logging.pattern.console=
